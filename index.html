<!doctype html>
<html lang="en" class="h-full bg-slate-900 select-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mamazul Review Race</title>

    <!-- iOS Installable & PWAs Meta Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Review Race" />
    <link rel="apple-touch-icon" href="web/icons/icon-192.png" />
    <link rel="manifest" href="manifest.json" />

    <!-- Style Engine & Foundations CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      /* Hide standard scrollbars for a cleaner iOS-like interface feel */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
    </style>
  </head>
  <body class="h-full flex items-center justify-center p-0 md:p-4 bg-slate-100">
    <!-- Mobile App Container Canvas wrapper - standard elegant size containment on desktop, full screen on iOS -->
    <div class="h-full w-full max-w-md bg-[#FFF9F2] text-[#3D405B] flex flex-col overflow-hidden relative shadow-2xl md:rounded-[3rem] border border-[#F2CC8F]/20">
      
      <!-- App Header Bar Component -->
      <header class="bg-white px-6 pt-12 pb-4 shadow-[0_2px_4px_-1px_rgba(0,0,0,0.01)] border-b border-[#F2CC8F]/25 flex flex-col shrink-0 gap-3 relative z-10">
        <div class="flex justify-between items-center">
          <div>
            <p class="text-[10px] font-black uppercase tracking-[0.22em] text-[#E07A5F]">Mamazul Tulum</p>
            <h1 class="text-xl font-black text-[#3D405B]">Review Race</h1>
          </div>
          
          <div class="flex items-center gap-3">
            <!-- Sync Indicator Pills -->
            <div id="sync-pill" class="flex items-center gap-1.5 bg-[#FFF9F2] px-2.5 py-1 rounded-full border border-[#F2CC8F]/30 shadow-inner">
              <span id="sync-text" class="text-[9px] font-black tracking-wide text-[#3D405B]/80">SYNCED</span>
              <div id="sync-dot" class="w-2 h-2 rounded-full bg-green-500"></div>
            </div>
            
            <!-- Mamazul Sun Emblem interactive button -->
            <button id="btn-sync-header" class="w-10 h-10 rounded-full bg-[#E07A5F]/10 flex items-center justify-center border-2 border-[#E07A5F] active:scale-90 transition-transform duration-200">
              <svg class="w-5 h-5 text-[#E07A5F]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Connection Error banner component -->
      <div id="global-error-box" class="mx-6 mt-4 p-4 bg-red-50 border border-red-200 rounded-2xl hidden shrink-0 z-10 transition-all duration-300"></div>

      <!-- Main Dashboard view Scrollable Content Canvas -->
      <main id="tab-view-container" class="flex-1 overflow-y-auto no-scrollbar px-6 py-6 pb-24 flex flex-col gap-6">
        <!-- Content will be programmatically injected here by routing framework -->
      </main>

      <!-- App Bottom Bar Navigation Footer -->
      <nav class="absolute bottom-0 left-0 right-0 h-20 bg-white border-t border-[#F2CC8F]/30 flex justify-around items-center px-4 pb-4 z-20 shadow-[0_-2px_10px_rgba(0,0,0,0.02)]">
        
        <!-- Dashboard Button -->
        <button data-tab="dashboard" class="tab-item flex flex-col items-center justify-center flex-1 py-2 text-[#E07A5F] active:scale-95 transition-all text-center">
          <div class="relative flex items-center justify-center">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
            </svg>
            <div class="active-indicator absolute -bottom-1 w-1.5 h-1.5 bg-[#E07A5F] rounded-full"></div>
          </div>
          <span class="text-[9px] font-black uppercase tracking-wider mt-1">LEADERBOARD</span>
        </button>

        <!-- Monthly Race Button -->
        <button data-tab="monthly" class="tab-item flex flex-col items-center justify-center flex-1 py-2 text-[#3D405B]/40 active:scale-95 transition-all text-center">
          <div class="relative flex items-center justify-center">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
            </svg>
            <div class="active-indicator absolute -bottom-1 w-1.5 h-1.5 bg-[#E07A5F] rounded-full hidden"></div>
          </div>
          <span class="text-[9px] font-black uppercase tracking-wider mt-1">RACE</span>
        </button>

        <!-- Yearly Race Button -->
        <button data-tab="yearly" class="tab-item flex flex-col items-center justify-center flex-1 py-2 text-[#3D405B]/40 active:scale-95 transition-all text-center">
          <div class="relative flex items-center justify-center">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/>
            </svg>
            <div class="active-indicator absolute -bottom-1 w-1.5 h-1.5 bg-[#E07A5F] rounded-full hidden"></div>
          </div>
          <span class="text-[9px] font-black uppercase tracking-wider mt-1">YEARLY</span>
        </button>

        <!-- Bonus Button -->
        <button data-tab="bonus" class="tab-item flex flex-col items-center justify-center flex-1 py-2 text-[#3D405B]/40 active:scale-95 transition-all text-center">
          <div class="relative flex items-center justify-center">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            <div class="active-indicator absolute -bottom-1 w-1.5 h-1.5 bg-[#E07A5F] rounded-full hidden"></div>
          </div>
          <span class="text-[9px] font-black uppercase tracking-wider mt-1">BONUS</span>
        </button>

        <!-- Settings Button -->
        <button data-tab="settings" class="tab-item flex flex-col items-center justify-center flex-1 py-2 text-[#3D405B]/40 active:scale-95 transition-all text-center">
          <div class="relative flex items-center justify-center">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
              <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
            </svg>
            <div class="active-indicator absolute -bottom-1 w-1.5 h-1.5 bg-[#E07A5F] rounded-full hidden"></div>
          </div>
          <span class="text-[9px] font-black uppercase tracking-wider mt-1">SETTINGS</span>
        </button>

      </nav>

      <!-- Waiter Analytics Slide-Up Modal Overlay -->
      <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs hidden z-50 items-end justify-center transition-opacity duration-300">
        <!-- iOS Slide-up Card sheet -->
        <div id="modal-card" class="bg-white w-full max-w-md rounded-t-[2.5rem] p-6 pb-10 shadow-2xl transform translate-y-full transition-transform duration-300 ease-out border-t border-[#F2CC8F]/30 relative z-50 max-h-[85%] flex flex-col">
          <!-- Grabber hook handle for visual cue -->
          <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-5 shrink-0"></div>
          
          <!-- Inner content -->
          <div id="modal-detail-content" class="overflow-y-auto pr-1 flex-1">
            <!-- Dynamic metadata details populated on tap selection -->
          </div>

          <!-- Close Button -->
          <button id="btn-close-modal" class="mt-6 w-full py-3.5 bg-[#E07A5F] text-white text-xs font-black rounded-full active:scale-95 transition-all outline-none">
            DISMISS DETAILS
          </button>
        </div>
      </div>

    </div>

    <!-- Application Controller Logic Script -->
    <script src="app.js"></script>
  </body>
</html>
